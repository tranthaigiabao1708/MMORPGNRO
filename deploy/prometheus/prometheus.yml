global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: "iu-local-dev"

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "iu-gateway"
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: "iu-gameapi"
    static_configs:
      - targets: ["gameapi:9091"]

  - job_name: "iu-coordinator"
    static_configs:
      - targets: ["coordinator:9092"]
